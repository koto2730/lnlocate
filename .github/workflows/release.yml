name: Release Build and Deploy

# Builds release artifacts for Android / Windows / Linux / macOS and creates a
# draft GitHub Release. Store uploads (Google Play / App Store) are not done
# for now; iOS is built by Xcode Cloud, not by this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  # ---------------------------------------------------------------- Android
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_CONTENT }}" | base64 --decode > android/app/release-keystore.jks

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/lnlocate-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/lnlocate-android.apk

  # ---------------------------------------------------------------- Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Create zip archive
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath lnlocate-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: lnlocate-windows-x64.zip

  # ------------------------------------------------------------------ Linux
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Create tar.gz archive
        run: tar -czf lnlocate-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: lnlocate-linux-x64.tar.gz

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Set up Flutter (ARM64 manual install)
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b ${{ env.FLUTTER_VERSION }} $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - run: flutter precache --linux
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Create tar.gz archive
        run: tar -czf lnlocate-linux-arm64.tar.gz -C build/linux/arm64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: lnlocate-linux-arm64.tar.gz

  # ------------------------------------------------------------------ macOS
  # Unsigned build for GitHub Releases (App Store builds are made elsewhere).
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Create zip archive
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/LNLocate.app lnlocate-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: lnlocate-macos.zip

  # ---------------------------------------------------------------- Release
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux, build-linux-arm64, build-macos]
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | sed 's/+.*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename artifacts with version
        run: |
          V=${{ steps.version.outputs.version }}
          mv artifacts/windows-x64/lnlocate-windows-x64.zip       artifacts/windows-x64/lnlocate-windows-x64-v${V}.zip
          mv artifacts/linux-x64/lnlocate-linux-x64.tar.gz        artifacts/linux-x64/lnlocate-linux-x64-v${V}.tar.gz
          mv artifacts/linux-arm64/lnlocate-linux-arm64.tar.gz    artifacts/linux-arm64/lnlocate-linux-arm64-v${V}.tar.gz
          mv artifacts/android-apk/lnlocate-android.apk           artifacts/android-apk/lnlocate-android-v${V}.apk
          mv artifacts/macos/lnlocate-macos.zip                   artifacts/macos/lnlocate-macos-v${V}.zip

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            artifacts/windows-x64/lnlocate-windows-x64-v${{ steps.version.outputs.version }}.zip
            artifacts/linux-x64/lnlocate-linux-x64-v${{ steps.version.outputs.version }}.tar.gz
            artifacts/linux-arm64/lnlocate-linux-arm64-v${{ steps.version.outputs.version }}.tar.gz
            artifacts/android-apk/lnlocate-android-v${{ steps.version.outputs.version }}.apk
            artifacts/macos/lnlocate-macos-v${{ steps.version.outputs.version }}.zip
